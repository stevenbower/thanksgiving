version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 24 && nvm use 24
        - npm install --cache .npm --prefer-offline --include=dev --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm use 24 || (nvm install 24 && nvm use 24)
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
