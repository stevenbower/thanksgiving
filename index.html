<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1a10">
<title>Turkey Day Takedown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --cream:#fff4dc; --brown:#3b2414; --orange:#e8742a; --red:#c0392b; --gold:#ffc53d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#2b1a10; color:var(--cream);
    font-family:'Nunito',system-ui,sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
  canvas#game { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; }
  .tbtn, #touch { -webkit-touch-callout:none; touch-action:none; }
  .screen { position:fixed; inset:0; display:none; touch-action:pan-y; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; text-align:center; z-index:10; overflow-y:auto; }
  .screen.show { display:flex; }
  h1,h2,.lilita { font-family:'Lilita One',cursive; font-weight:400; letter-spacing:1px; margin:0; }
  #title { background:#2b1a10 center/cover no-repeat; justify-content:flex-start; padding-top:max(4vh,16px); }
  #title::before { content:''; position:absolute; inset:0; background:linear-gradient(#0008 0%, #0000 35%, #0000 65%, #000a 100%); pointer-events:none; }
  #title > * { position:relative; }
  #title h1 { font-size:clamp(40px,9vw,96px); color:var(--gold); line-height:.95;
    text-shadow:0 4px 0 #8a3b12, 0 8px 0 #3b2414, 0 10px 24px #000a; }
  #title .sub { font-size:clamp(15px,2.6vw,22px); font-weight:800; margin-top:10px; text-shadow:0 2px 6px #000; }
  #title .bottom { margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:10px; padding-bottom:max(3vh,12px); }
  .btn { font-family:'Lilita One',cursive; font-size:clamp(20px,3.6vw,30px); color:#fff; background:linear-gradient(#f08a3a,#c9541a);
    border:3px solid #3b2414; border-radius:16px; padding:12px 34px; cursor:pointer; box-shadow:0 6px 0 #3b2414, 0 10px 20px #0007;
    transition:transform .08s; letter-spacing:1px; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #3b2414; }
  .btn.alt { background:linear-gradient(#8a6a4a,#5b3d22); font-size:clamp(16px,2.6vw,22px); padding:8px 22px; }
  .hint { font-size:14px; opacity:.85; text-shadow:0 1px 3px #000; max-width:640px; }
  #select { background:radial-gradient(ellipse at center,#5b3416 0%,#2b1a10 75%); justify-content:flex-start; padding-top:24px; }
  #select h2 { font-size:clamp(28px,5vw,46px); color:var(--gold); text-shadow:0 3px 0 #8a3b12; }
  #cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; width:100%; max-width:1000px; margin:18px 0; }
  .card { background:linear-gradient(#fff4dc,#f1d9a8); color:var(--brown); border:3px solid #3b2414; border-radius:18px; padding:10px 10px 12px;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; box-shadow:0 5px 0 #3b2414; transition:transform .12s; }
  .card:hover { transform:translateY(-4px); }
  .card.sel { background:linear-gradient(#ffe08a,#ffb347); transform:translateY(-6px); box-shadow:0 0 0 4px var(--gold), 0 8px 0 #3b2414; }
  .card img { height:130px; object-fit:contain; filter:drop-shadow(0 4px 2px #0004); pointer-events:none; }
  .card input { font-family:'Lilita One',cursive; font-size:20px; color:var(--brown); text-align:center; width:100%;
    border:none; border-bottom:2px dashed #3b241466; background:transparent; margin-top:6px; padding:2px; user-select:text; -webkit-user-select:text; }
  .card input:focus { outline:none; border-bottom-color:var(--orange); }
  .card .role { font-weight:800; font-size:13px; color:#8a3b12; text-transform:uppercase; letter-spacing:.5px; }
  .card .perk { font-size:12.5px; margin-top:4px; line-height:1.25; min-height:3em; }
  .card .stats { display:flex; gap:8px; font-size:11px; font-weight:800; margin-top:6px; opacity:.8; }
  #goBtn { position:sticky; bottom:12px; flex-shrink:0; }
  @media (max-width:700px) {
    #cards { grid-template-columns:repeat(2,1fr); gap:10px; margin:12px 0; }
    .card { padding:6px 6px 8px; border-radius:14px; }
    .card img { height:84px; }
    .card input { font-size:17px; }
    .card .role { font-size:11px; }
    .card .perk { font-size:11.5px; min-height:0; }
  }
  @media (max-height:600px) { .card img { height:80px; } .card .perk { display:none; } }
  #over { background:#000b; }
  #over h2 { font-size:clamp(40px,8vw,72px); color:var(--gold); text-shadow:0 4px 0 #8a3b12; }
  #over .stats { font-size:20px; margin:16px 0 22px; line-height:1.6; font-weight:800; }
  #over .row, #pause .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  #pause { background:#0009; gap:16px; }
  #pause h2 { font-size:52px; color:var(--gold); }
  /* touch controls */
  #touch { position:fixed; inset:0; pointer-events:none; z-index:5; display:none; }
  #touch.show { display:block; }
  .tbtn { position:absolute; pointer-events:auto; width:64px; height:64px; border-radius:50%; border:3px solid #fff8;
    background:#3b2414aa; display:flex; align-items:center; justify-content:center; font-family:'Lilita One'; font-size:12px; color:#fff; }
  .tbtn img { width:40px; height:40px; object-fit:contain; pointer-events:none; }
  #tPause { top:max(10px,env(safe-area-inset-top)); right:50%; transform:translateX(50%); width:44px; height:44px; font-size:18px; }
  #topbtns { position:fixed; top:10px; right:10px; z-index:6; display:flex; gap:8px; }
  .ibtn { width:40px; height:40px; border-radius:12px; border:2px solid #fff6; background:#3b2414aa; color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="title" class="screen show">
  <h1>TURKEY DAY<br>TAKEDOWN</h1>
  <div class="sub">The feast has turned against us. Grab the gravy. Defend the family.</div>
  <div class="bottom">
    <button class="btn" id="playBtn">PLAY</button>
    <div class="hint" id="ctrlHint"></div>
    <div class="hint" id="hiScore"></div>
  </div>
</div>

<div id="select" class="screen">
  <h2>Choose Your Fighter</h2>
  <div class="hint">Tap a name to rename them!</div>
  <div id="cards"></div>
  <button class="btn" id="goBtn">LET'S GOBBLE!</button>
</div>

<div id="pause" class="screen">
  <h2>Paused</h2>
  <div class="row">
    <button class="btn" id="resumeBtn">Resume</button>
    <button class="btn alt" id="quitBtn">Quit</button>
  </div>
</div>

<div id="over" class="screen">
  <h2 id="overTitle">STUFFED!</h2>
  <div class="stats" id="overStats"></div>
  <div class="row">
    <button class="btn" id="againBtn">Play Again</button>
    <button class="btn alt" id="charBtn">Change Fighter</button>
  </div>
</div>

<div id="touch">
  <div class="tbtn" id="tBomb" style="right:112px;bottom:34px"><img src="assets/w_bomb.png" alt="bomb"></div>
  <div class="tbtn" id="tDash" style="right:24px;bottom:110px">DASH</div>
  <div class="tbtn" id="tSpecial" style="right:100px;bottom:112px;width:70px;height:70px;background:#c9541acc;display:none">CHARGE</div>
  <div class="tbtn" id="tSwap" style="right:24px;bottom:190px;width:54px;height:54px">SWAP</div>
</div>
<div id="topbtns">
  <button class="ibtn" id="muteBtn" title="Mute (M)">🔊</button>
  <button class="ibtn" id="pauseBtn" title="Pause (Esc)" style="display:none">⏸</button>
</div>

<script src="assets/anim.js?v=6"></script>
<script src="game.js?v=9"></script>
</body>
</html>
