<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1a10">
<title>Turkey Day Takedown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --cream:#fff4dc; --brown:#3b2414; --orange:#e8742a; --red:#c0392b; --gold:#ffc53d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#2b1a10; color:var(--cream);
    font-family:'Nunito',system-ui,sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; }
  .tbtn, #touch { -webkit-touch-callout:none; touch-action:none; }
  .screen { position:fixed; inset:0; display:none; touch-action:pan-y; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; text-align:center; z-index:10; overflow-y:auto; }
  .screen.show { display:flex; }
  h1,h2,.lilita { font-family:'Lilita One',cursive; font-weight:400; letter-spacing:1px; margin:0; }
  #title { background:#2b1a10 center/cover no-repeat; justify-content:flex-start; padding-top:max(4vh,16px); }
  #title::before { content:''; position:absolute; inset:0; background:linear-gradient(#0008 0%, #0000 35%, #0000 65%, #000a 100%); pointer-events:none; }
  #title > * { position:relative; }
  #title h1 { font-size:clamp(40px,9vw,96px); color:var(--gold); line-height:.95;
    text-shadow:0 4px 0 #8a3b12, 0 8px 0 #3b2414, 0 10px 24px #000a; }
  #title .sub { font-size:clamp(15px,2.6vw,22px); font-weight:800; margin-top:10px; text-shadow:0 2px 6px #000; }
  #title .bottom { margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:10px; padding-bottom:max(3vh,12px); }
  .btn { font-family:'Lilita One',cursive; font-size:clamp(20px,3.6vw,30px); color:#fff; background:linear-gradient(#f08a3a,#c9541a);
    border:3px solid #3b2414; border-radius:16px; padding:12px 34px; cursor:pointer; box-shadow:0 6px 0 #3b2414, 0 10px 20px #0007;
    transition:transform .08s; letter-spacing:1px; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #3b2414; }
  .btn.alt { background:linear-gradient(#8a6a4a,#5b3d22); font-size:clamp(16px,2.6vw,22px); padding:8px 22px; }
  .hint { font-size:14px; opacity:.85; text-shadow:0 1px 3px #000; max-width:640px; }
  #select { background:radial-gradient(ellipse at center,#5b3416 0%,#2b1a10 75%); justify-content:flex-start; padding-top:24px; }
  #select h2 { font-size:clamp(28px,5vw,46px); color:var(--gold); text-shadow:0 3px 0 #8a3b12; }
  #cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; width:100%; max-width:900px; margin:18px 0; }
  .card { background:linear-gradient(#fff4dc,#f1d9a8); color:var(--brown); border:3px solid #3b2414; border-radius:18px; padding:10px 10px 12px;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; box-shadow:0 5px 0 #3b2414; transition:transform .12s; }
  .card:hover { transform:translateY(-4px); }
  .card.sel { background:linear-gradient(#ffe08a,#ffb347); transform:translateY(-6px); box-shadow:0 0 0 4px var(--gold), 0 8px 0 #3b2414; }
  .card img { height:130px; object-fit:contain; filter:drop-shadow(0 4px 2px #0004); pointer-events:none; }
  .card .cname { font-family:'Lilita One',cursive; font-size:20px; color:var(--brown); text-align:center; width:100%; margin-top:6px; padding:2px; }
  .card .role { font-weight:800; font-size:13px; color:#8a3b12; text-transform:uppercase; letter-spacing:.5px; }
  .card .perk { font-size:12.5px; margin-top:4px; line-height:1.25; min-height:3em; }
  .card .stats { display:flex; gap:8px; font-size:11px; font-weight:800; margin-top:6px; opacity:.8; }
  #goBtn { position:sticky; bottom:12px; flex-shrink:0; }
  @media (max-width:700px) {
    #cards { grid-template-columns:repeat(2,1fr); gap:10px; margin:12px 0; }
    .card { padding:6px 6px 8px; border-radius:14px; }
    .card img { height:84px; }
    .card .cname { font-size:17px; }
    .card .role { font-size:11px; }
    .card .perk { font-size:11.5px; min-height:0; }
  }
  @media (max-height:600px) { .card img { height:80px; } .card .perk { display:none; } }
  #over { background:#000b; }
  #over h2 { font-size:clamp(40px,8vw,72px); color:var(--gold); text-shadow:0 4px 0 #8a3b12; }
  #over .stats { font-size:20px; margin:16px 0 22px; line-height:1.6; font-weight:800; }
  #over .row, #pause .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  #pause { background:#0009; gap:16px; }
  #pause h2 { font-size:52px; color:var(--gold); }
  /* touch controls */
  #touch { position:fixed; inset:0; pointer-events:none; z-index:5; display:none; }
  #touch.show { display:block; }
  /* action pad: one bottom-right cluster. small round buttons (58px) for utilities, big ones (78px) for attacks,
     all on one baseline with even gaps; hidden buttons collapse so the rest stay lined up against the corner */
  #pad { position:absolute; right:calc(16px + env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:flex-end; gap:12px; pointer-events:none; }
  #pad .row { display:flex; align-items:center; gap:12px; }
  #pad .tbtn { position:relative; }
  .tbtn.sm { width:58px; height:58px; font-size:12px; margin:0 10px; } /* 58 + 2*10 = 78: every button sits in the same column width */
  .tbtn.lg { width:78px; height:78px; font-size:16px; }
  .tbtn.sm img { width:36px; height:36px; }
  .tbtn { position:absolute; pointer-events:auto; width:64px; height:64px; border-radius:50%; border:3px solid #fff8;
    background:#3b2414aa; display:flex; align-items:center; justify-content:center; font-family:'Lilita One'; font-size:12px; color:#fff; }
  #tFire.down { background:#ff5a3acc !important; transform:scale(.92); }
  .tbtn img { width:40px; height:40px; object-fit:contain; pointer-events:none; }
  #tPause { top:max(10px,env(safe-area-inset-top)); right:50%; transform:translateX(50%); width:44px; height:44px; font-size:18px; }
  #topbtns { position:fixed; top:10px; right:10px; z-index:6; display:flex; gap:8px; }
  .ibtn.wide { width:auto; padding:0 10px; font-family:'Lilita One'; font-size:14px; letter-spacing:.5px; background:#2f7a2acc; }
  .ibtn.wide.off { background:#3b2414aa; }
  #levels { background:radial-gradient(ellipse at center,#5b3416 0%,#2b1a10 75%); justify-content:flex-start; padding-top:24px; gap:10px; }
  #levels h2 { font-size:clamp(28px,5vw,46px); color:var(--gold); text-shadow:0 3px 0 #8a3b12; }
  #lvlGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; width:100%; max-width:900px; margin:8px 0; }
  .lvl { font-family:'Nunito'; background:linear-gradient(#fff4dc,#f1d9a8); color:var(--brown); border:3px solid #3b2414; border-radius:14px; padding:8px 6px;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; box-shadow:0 4px 0 #3b2414; }
  .lvl b { font-family:'Lilita One'; font-size:26px; font-weight:400; line-height:1; }
  .lvl span { font-size:12px; font-weight:800; line-height:1.15; }
  .lvl.boss { background:linear-gradient(#ffb36a,#e8742a); }
  .lvl:active { transform:translateY(3px); box-shadow:0 1px 0 #3b2414; }
  .godrow { font-weight:800; display:flex; gap:8px; align-items:center; font-size:16px; }
  .godrow input { width:22px; height:22px; }
  @media (max-width:700px) { #lvlGrid { grid-template-columns:repeat(3,1fr); } .lvl span { font-size:11px; } }
  /* name entry, multiplayer menu, lobby, scores */
  .field { font-family:'Lilita One',cursive; font-size:22px; color:var(--brown); background:#fff4dc; border:3px solid #3b2414; border-radius:12px;
    padding:8px 12px; width:min(320px,86vw); text-align:center; user-select:text; -webkit-user-select:text; }
  .field:focus { outline:none; border-color:var(--orange); }
  .namerow { display:flex; flex-direction:column; align-items:center; gap:4px; margin:8px 0 2px; font-weight:800; }
  #multi, #lobby, #scores { background:radial-gradient(ellipse at center,#5b3416 0%,#2b1a10 75%); justify-content:flex-start; padding-top:28px; gap:12px; }
  #multi h2, #lobby h2, #scores h2 { font-size:clamp(28px,5vw,46px); color:var(--gold); text-shadow:0 3px 0 #8a3b12; }
  .panel { background:#3b2414cc; border:2px solid #fff3; border-radius:18px; padding:14px 16px; width:min(420px,92vw); display:flex; flex-direction:column; align-items:center; gap:10px; }
  .panel .or { opacity:.7; font-weight:800; }
  #joinCode { letter-spacing:8px; text-transform:uppercase; width:180px; font-size:30px; }
  #multiMsg, #lobbyMsg { font-weight:800; min-height:1.3em; color:#ffd9a0; }
  .codebox { display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; }
  #lobbyCode { font-family:'Lilita One'; font-size:clamp(44px,10vw,72px); letter-spacing:10px; color:#fff; background:#2b1a10; border:3px dashed var(--gold); border-radius:16px; padding:2px 18px; }
  #lobbyList { width:min(520px,94vw); display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; }
  .lp { background:#fff4dc; color:var(--brown); border-radius:10px; padding:6px 10px; display:flex; flex-direction:column; align-items:flex-start; border:2px solid #3b2414; }
  .lp.me { background:#ffe08a; }
  .lp .pn { font-family:'Lilita One'; font-size:17px; } .lp .pc { font-size:12px; font-weight:800; color:#8a3b12; }
  #lobbyCards { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; width:min(900px,96vw); }
  .lcard { background:linear-gradient(#fff4dc,#f1d9a8); color:var(--brown); border:3px solid #3b2414; border-radius:14px; padding:6px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; box-shadow:0 4px 0 #3b2414; }
  .lcard img { height:74px; object-fit:contain; pointer-events:none; }
  .lcard .cn { font-family:'Lilita One'; font-size:15px; } .lcard .by { font-size:11px; font-weight:800; color:#8a3b12; text-align:center; }
  .lcard.sel { background:linear-gradient(#ffe08a,#ffb347); box-shadow:0 0 0 4px var(--gold), 0 4px 0 #3b2414; }
  .lcard.taken { opacity:.45; filter:grayscale(.7); cursor:not-allowed; }
  .lcard.taken .by { color:#3b2414; }
  .btn:disabled { filter:grayscale(1); opacity:.5; }
  #lobbyLinks { font-size:12px; opacity:.75; min-height:1em; }
  #scoreTabs { display:flex; gap:8px; }
  #scoreTabs button { font-family:'Lilita One'; font-size:18px; padding:6px 18px; border-radius:12px; border:2px solid #3b2414; background:#8a6a4a; color:#fff; cursor:pointer; }
  #scoreTabs button.on { background:linear-gradient(#f08a3a,#c9541a); }
  #scoreList { width:min(640px,94vw); display:flex; flex-direction:column; gap:6px; }
  .srow { display:grid; grid-template-columns:36px 1fr auto auto; gap:10px; align-items:center; background:#fff4dc; color:var(--brown); border-radius:10px; padding:8px 12px; border:2px solid #3b2414; text-align:left; }
  .srow .rk { font-family:'Lilita One'; font-size:20px; color:#c9541a; } .srow .nm { font-weight:800; font-size:14px; }
  .srow .lv { font-size:12px; font-weight:800; opacity:.7; } .srow .sc { font-family:'Lilita One'; font-size:20px; }
  .srow:nth-child(1) { background:#ffe08a; } .srow:nth-child(2) { background:#f3f0e8; } .srow:nth-child(3) { background:#f6dcc0; }
  .ibtn { width:40px; height:40px; border-radius:12px; border:2px solid #fff6; background:#3b2414aa; color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="title" class="screen show">
  <h1>TURKEY DAY<br>TAKEDOWN</h1>
  <div class="sub">The feast has turned against us. Grab the gravy. Defend the family.</div>
  <div class="bottom">
    <div class="row" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="btn" id="playBtn">SOLO</button>
      <button class="btn" id="multiBtn">MULTIPLAYER</button>
    </div>
    <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="btn alt" id="scoresBtn">HIGH SCORES</button>
      <button class="btn alt" id="testBtn">TEST MODE</button>
    </div>
    <div class="hint" id="ctrlHint"></div>
    <div class="hint" id="hiScore"></div>
  </div>
</div>

<div id="select" class="screen">
  <h2>Choose Your Fighter</h2>
  <label class="namerow">Your name (for the high score board)<input class="field" id="pnameSel" maxlength="14" placeholder="Your name" autocomplete="off"></label>
  <div id="cards"></div>
  <button class="btn" id="goBtn">LET'S GOBBLE!</button>
</div>

<div id="levels" class="screen">
  <h2>Test Mode: Pick a Level</h2>
  <label class="godrow"><input type="checkbox" id="godChk"> Invincible</label>
  <div id="lvlGrid"></div>
  <button class="btn alt" id="lvlBack">Back</button>
</div>

<div id="multi" class="screen">
  <h2>Multiplayer</h2>
  <label class="namerow">Your name<input class="field" id="pnameMulti" maxlength="14" placeholder="Your name" autocomplete="off"></label>
  <div class="panel">
    <button class="btn" id="hostBtn">HOST A GAME</button>
    <div class="or">— or join a friend —</div>
    <input class="field" id="joinCode" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" inputmode="text">
    <button class="btn" id="joinBtn">JOIN</button>
  </div>
  <div id="multiMsg"></div>
  <button class="btn alt" id="multiBack">Back</button>
</div>

<div id="lobby" class="screen">
  <h2>Lobby</h2>
  <div class="codebox"><span class="hint" style="font-size:16px;font-weight:800">Game code</span><div id="lobbyCode">----</div><button class="btn alt" id="lobbyShare">Share invite</button></div>
  <div id="lobbyList"></div>
  <div id="lobbyMsg"></div>
  <div id="lobbyCards"></div>
  <div id="lobbyLinks"></div>
  <div class="row" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding-bottom:16px">
    <button class="btn" id="lobbyStart" disabled>START GAME</button>
    <button class="btn alt" id="lobbyLeave">Leave</button>
  </div>
</div>

<div id="scores" class="screen">
  <h2>High Scores</h2>
  <div id="scoreTabs"><button data-mode="single" class="on">Solo</button><button data-mode="multi">Multiplayer</button></div>
  <div id="scoreList"></div>
  <button class="btn alt" id="scoresBack">Back</button>
</div>

<div id="pause" class="screen">
  <h2 id="pauseTitle">Paused</h2>
  <div class="row">
    <button class="btn" id="resumeBtn">Resume</button>
    <button class="btn alt" id="quitBtn">Quit</button>
  </div>
</div>

<div id="over" class="screen">
  <h2 id="overTitle">STUFFED!</h2>
  <div class="stats" id="overStats"></div>
  <div class="row">
    <button class="btn" id="againBtn">Play Again</button>
    <button class="btn alt" id="charBtn">Change Fighter</button>
    <button class="btn alt" id="overQuitBtn">Quit</button>
  </div>
</div>

<div id="touch">
  <div id="pad">
    <div class="row">
      <div class="tbtn sm" id="tSwap">SWAP</div>
      <div class="tbtn sm" id="tDash">DASH</div>
    </div>
    <div class="row">
      <div class="tbtn sm" id="tBomb"><img src="assets/w_bomb.png" alt="bomb"></div>
      <div class="tbtn lg" id="tSpecial" style="background:#c9541acc;display:none">CHARGE</div>
      <div class="tbtn lg" id="tFire" style="background:#c0392bcc;display:none">FIRE</div>
    </div>
  </div>
</div>
<div id="topbtns">
  <button class="ibtn wide" id="aimBtn" title="Auto-aim (T)" style="display:none">🎯 AIM ON</button>
  <button class="ibtn wide" id="fireBtn" title="Auto-fire (R)" style="display:none">🔥 FIRE ON</button>
  <button class="ibtn" id="muteBtn" title="Mute (M)">🔊</button>
  <button class="ibtn" id="pauseBtn" title="Pause (Esc)" style="display:none">⏸</button>
</div>

<script type="module" src="/src/main.js"></script>
<script src="assets/anim.js?v=10"></script>
<script src="game.js?v=37"></script>
</body>
</html>
